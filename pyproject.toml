[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "owedits"
version = "0.1.0"
description = "Auto-clip multi-kills and team wipes from Overwatch gameplay videos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "click>=8.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "imagehash>=4.3",
    "Pillow>=10.0",
    "tkinterdnd2>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
owedits = "owedits.cli:main"

[project.gui-scripts]
owedits-gui = "owedits.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
